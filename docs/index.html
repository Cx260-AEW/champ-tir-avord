<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champ de tir DGA TT — État des itinéraires</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
  :root {
    --paper: #E8E1CC;
    --paper-panel: #F2EEDE;
    --ink: #1D231F;
    --ink-soft: #4A5248;
    --line: #C9BF9E;
    --navy: #24303D;
    --navy-soft: #3B4A5A;
    --open: #4B6B3A;
    --open-soft: #E3EAD9;
    --closed: #A33B2E;
    --closed-soft: #F3DFD9;
    --warn: #8A6417;
    --warn-soft: #F4E9D2;
    --unknown: #8A8272;
    --radius: 3px;
    --font-head: 'Public Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-head);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: var(--navy);
    color: var(--paper);
    padding: 1.1rem 1.5rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    border-bottom: 3px solid var(--closed);
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header a.pdf-link {
    color: var(--paper);
    background: var(--closed);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.5rem 0.85rem;
    border-radius: var(--radius);
    white-space: nowrap;
  }
  header a.pdf-link:hover { filter: brightness(1.1); }

  .controls {
    background: var(--paper-panel);
    border-bottom: 1px solid var(--line);
    padding: 0.7rem 1.5rem;
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .tab-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .tab-group > div { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .tab-group-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-right: 0.5rem;
    font-family: var(--font-mono);
  }
  .tab {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    padding: 0.4rem 0.7rem;
    border-radius: var(--radius);
    font-family: var(--font-head);
    font-size: 0.85rem;
    cursor: pointer;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .tab strong { display: block; font-size: 0.85rem; }
  .tab span.small { display: block; font-size: 0.68rem; color: var(--ink-soft); font-family: var(--font-mono); }
  .tab.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--paper);
  }
  .tab.active span.small { color: var(--paper); }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    min-height: 0;
  }
  #map { width: 100%; height: 100%; background: var(--paper); }

  aside {
    background: var(--paper-panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 0.9rem;
  }
  aside h2 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 0.6rem;
    font-family: var(--font-mono);
  }
  .route-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.55rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 0.45rem;
    cursor: pointer;
    background: var(--paper);
  }
  .route-item:hover { border-color: var(--navy-soft); }
  .route-item .name { font-size: 0.82rem; font-weight: 600; line-height: 1.25; }
  .route-item .code { font-size: 0.68rem; color: var(--ink-soft); font-family: var(--font-mono); }
  .badge {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    white-space: nowrap;
    font-family: var(--font-mono);
  }
  .badge.ouverte { background: var(--open-soft); color: var(--open); }
  .badge.fermee { background: var(--closed-soft); color: var(--closed); }
  .badge.inconnue { background: transparent; color: var(--unknown); border: 1px dashed var(--unknown); }

  .view-toggle-btn { display: none; }

  footer {
    background: var(--navy);
    color: var(--paper);
    font-size: 0.75rem;
    padding: 0.6rem 1.5rem;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
    font-family: var(--font-mono);
  }
  footer a { color: var(--paper); }
  .legend { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  .legend .dot { display: inline-flex; align-items: center; gap: 0.35rem; }
  .legend .swatch { width: 14px; height: 3px; display: inline-block; border-radius: 2px; }

  #stale-banner { display: none; }

  .status-bar {
    background: var(--paper-panel);
    border-bottom: 1px solid var(--line);
    padding: 0.6rem 1.5rem;
    display: flex;
    align-items: stretch;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .status-card {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.85rem;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    flex: 1;
    min-width: 260px;
    transition: background-color 0.2s, border-color 0.2s;
  }
  .status-card.fresh { border-color: var(--open); background: var(--open-soft); }
  .status-card.warn { border-color: var(--warn); background: var(--warn-soft); }
  .status-card.stale { border-color: var(--closed); background: var(--closed-soft); }
  .status-icon { font-size: 1.15rem; line-height: 1; flex-shrink: 0; }
  .status-card.fresh .status-icon { color: var(--open); }
  .status-card.warn .status-icon { color: var(--warn); }
  .status-card.stale .status-icon { color: var(--closed); }
  .status-main { font-size: 0.82rem; font-weight: 700; line-height: 1.3; }
  .status-sub { font-size: 0.72rem; color: var(--ink-soft); font-family: var(--font-mono); margin-top: 0.1rem; }

  .update-controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .force-update-btn {
    border: 1px solid var(--navy);
    background: var(--navy);
    color: var(--paper);
    padding: 0.55rem 1rem;
    border-radius: var(--radius);
    font-family: var(--font-head);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .force-update-btn:hover:not(:disabled) { filter: brightness(1.2); }
  .force-update-btn:disabled { opacity: 0.55; cursor: default; }

  .view-toggle-btn {
    border: 1px solid var(--navy);
    background: transparent;
    color: var(--navy);
    padding: 0.55rem 1rem;
    border-radius: var(--radius);
    font-family: var(--font-head);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .view-toggle-btn:hover { background: var(--paper); }
  .view-toggle-btn.active { background: var(--navy); color: var(--paper); }

  .leaflet-popup-content-wrapper { border-radius: var(--radius); font-family: var(--font-head); }
  .popup-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.3rem; }
  .popup-code { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft); margin-bottom: 0.5rem; }
  .popup-row { display: flex; justify-content: space-between; font-size: 0.78rem; padding: 0.15rem 0; gap: 1rem; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    header { padding: 0.9rem 1rem; }

    .controls {
      padding: 0.6rem 1rem;
      position: sticky;
      top: 0;
      z-index: 500;
      flex-direction: column;
      align-items: stretch;
      gap: 0.5rem;
    }
    .tab-group { width: 100%; display: flex; flex-wrap: nowrap; gap: 0.3rem; }
    .tab-group > div { display: flex; flex: 1; gap: 0.3rem; }
    .tab-group-label { display: none; }
    .tab {
      flex: 1 1 0;
      min-width: 0;
      min-height: 44px;
      padding: 0.35rem 0.25rem;
      text-align: center;
    }
    .tab strong {
      font-size: 0.76rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab span.small {
      font-size: 0.58rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-bar { padding: 0.6rem 1rem; flex-direction: column; }
    .status-card { min-width: 0; width: 100%; }
    .update-controls { width: 100%; }
    .force-update-btn { flex: 1; min-height: 44px; }
    .view-toggle-btn { display: block; flex: 1; min-height: 44px; }

    footer {
      padding: 0.6rem 1rem;
      flex-direction: column;
      align-items: stretch;
      gap: 0.4rem;
    }
    .legend { align-self: flex-start; }
    footer a { align-self: flex-end; }

    /* Sur mobile, la carte et la liste des itinéraires occupent le même
       espace : le bouton "Itinéraires" bascule de l'une à l'autre plutôt
       que de les empiler. */
    main { position: relative; }
    aside { border-left: none; width: 100%; height: 100%; display: none; }
    main.show-list #map { display: none; }
    main.show-list aside { display: block; }
  }
  .update-progress { margin: 0.5rem 1rem 0; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid var(--warn); background: var(--warn-soft); font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink); }
  .update-progress.success { border-color: var(--open); background: var(--open-soft); }
  .update-progress.error { border-color: var(--closed); background: var(--closed-soft); }
  .update-progress-bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,0.1); margin-top: 0.45rem; overflow: hidden; }
  .update-progress-fill { height: 100%; width: 0; background: var(--warn); transition: width 0.4s ease; }
  .update-progress.success .update-progress-fill { background: var(--open); }
  .update-progress.error .update-progress-fill { background: var(--closed); }
  .update-reload-btn { margin-top: 0.5rem; padding: 0.4rem 0.9rem; border-radius: 6px; border: 1px solid var(--open); background: var(--open); color: #fff; font-family: inherit; font-size: 0.8rem; cursor: pointer; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Champ de tir DGA TT — Bourges</h1>
  </div>
  <a class="pdf-link" id="pdf-link" href="#" target="_blank" rel="noopener">Voir le document officiel (PDF)</a>
</header>

<div class="status-bar">
  <div class="status-card" id="status-card">
    <span class="status-icon" id="status-icon">…</span>
    <div>
      <div class="status-main" id="status-main">Chargement…</div>
      <div class="status-sub" id="status-sub"></div>
    </div>
  </div>
  <div class="update-controls">
    <button class="force-update-btn" id="force-update-btn">Forcer une mise à jour</button>
    <button class="view-toggle-btn" id="route-view-toggle">Itinéraires</button>
  </div>
</div>

<div class="update-progress" id="update-progress" hidden>
  <div class="update-progress-text" id="update-progress-text"></div>
  <div class="update-progress-bar"><div class="update-progress-fill" id="update-progress-fill"></div></div>
  <button class="update-reload-btn" id="update-reload-btn" hidden>Recharger la page</button>
</div>

<div class="controls">
  <div class="tab-group">
    <span class="tab-group-label">Jour</span>
    <div id="day-tabs"></div>
  </div>
  <div class="tab-group">
    <span class="tab-group-label">Tranche</span>
    <div id="slot-tabs"></div>
  </div>
</div>

<main>
  <div id="map"></div>
  <aside>
    <h2>Itinéraires</h2>
    <div id="route-list"></div>
  </aside>
</main>

<footer>
  <div class="legend">
    <span class="dot"><span class="swatch" style="background:var(--open)"></span>Ouvert</span>
    <span class="dot"><span class="swatch" style="background:var(--closed);border-top:2px dashed var(--closed)"></span>Fermé</span>
    <span class="dot"><span class="swatch" style="background:#000000"></span>Route d'accès</span>
  </div>
  <a href="https://github.com/Cx260-AEW/champ-tir-avord" target="_blank" rel="noopener">Code source</a>
</footer>

<script>
const STATUS_LABELS = { matin: "Matin", apres_midi: "Après-midi", nuit: "Nuit" };
const DAY_FMT = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });

// URL du relais public (Cloudflare Worker) qui déclenche le workflow
// GitHub sans exposer aucun jeton au navigateur. Voir worker/README.md
// pour le déployer, puis coller son URL ci-dessous.
const UPDATE_WORKER_URL = 'https://tight-bonus-3b9echamp-tir-update.polocoulbouee26.workers.dev/';

let state = { geojson: null, status: null, dayIndex: 0, slot: 'matin' };
let map, routeLayers = {}, zoneLayer;

function guessDefaultSlot() {
  const h = new Date().getHours() + new Date().getMinutes() / 60;
  if (h >= 8.67 && h < 12) return 'matin';
  if (h >= 13.67 && h < 18) return 'apres_midi';
  if (h >= 20 || h < 1) return 'nuit';
  if (h < 8.67) return 'matin';
  if (h < 13.67) return 'apres_midi';
  return 'nuit';
}

async function init() {
  // cache: 'no-store' : sans ça, le navigateur peut continuer à servir une
  // copie en cache de ces fichiers après une mise à jour, retardant
  // l'affichage des données fraîches malgré une actualisation réussie
  // côté serveur.
  const [geoRes, statusRes] = await Promise.all([
    fetch('data/routes.geojson', { cache: 'no-store' }),
    fetch('data/status.json', { cache: 'no-store' }),
  ]);
  state.geojson = await geoRes.json();
  state.status = await statusRes.json();
  state.slot = guessDefaultSlot();

  // Le bouton pointe vers la copie du PDF hébergée avec le site (mise à jour
  // à chaque actualisation). L'adresse d'origine contient un token qui expire :
  // l'utiliser directement donnait un lien mort une fois sur deux.
  // Le paramètre ?v= évite qu'un navigateur serve une ancienne copie en cache.
  const cacheBuster = encodeURIComponent(state.status.generated_at);
  const pdfLink = document.getElementById('pdf-link');
  if (state.status.local_pdf) {
    pdfLink.href = state.status.local_pdf + '?v=' + cacheBuster;
  } else {
    // Ancien status.json sans copie locale : on retombe sur l'adresse d'origine.
    const sep = state.status.source_pdf.includes('?') ? '&' : '?';
    pdfLink.href = state.status.source_pdf + sep + 'v=' + cacheBuster;
  }

  initMap();
  renderDayTabs();
  renderSlotTabs();
  renderAll();
  initRouteDrawer();

  document.getElementById('force-update-btn').addEventListener('click', forceUpdate);
}

function initRouteDrawer() {
  const mainEl = document.querySelector('main');
  const toggle = document.getElementById('route-view-toggle');

  function showList() {
    mainEl.classList.add('show-list');
    toggle.textContent = 'Carte';
    toggle.classList.add('active');
  }
  function showMap() {
    mainEl.classList.remove('show-list');
    toggle.textContent = 'Itinéraires';
    toggle.classList.remove('active');
  }
  toggle.addEventListener('click', () => {
    mainEl.classList.contains('show-list') ? showMap() : showList();
  });

  window.closeRouteDrawer = showMap;
}

function initMap() {
  map = L.map('map', { zoomControl: true }).setView([47.02, 2.65], 11);
  // Fond de carte OpenStreetMap standard — pas de clé API requise, contrairement
  // au fond CARTO utilisé auparavant (CARTO exige désormais une clé depuis fin
  // août 2026, sans quoi les tuiles sont marquées "API KEY REQUIRED").
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
    maxZoom: 19,
    subdomains: 'abc',
  }).addTo(map);

  const zoneFeature = state.geojson.features.find(f => f.properties.kind === 'zone');
  if (zoneFeature) {
    zoneLayer = L.geoJSON(zoneFeature, {
      style: { color: 'var(--navy-soft)'.trim(), weight: 1.5, dashArray: '4 3', fillColor: '#7A8A6A', fillOpacity: 0.12, className: 'zone-poly' }
    }).addTo(map);
  }

  const bounds = [];
  state.geojson.features.filter(f => f.properties.kind === 'route').forEach(f => {
    const layer = L.geoJSON(f, { style: () => baseRouteStyle() });
    layer.addTo(map);
    layer.on('click', () => focusRoute(f.properties.route_id));
    routeLayers[f.properties.route_id] = { layer, feature: f };
    layer.eachLayer(l => bounds.push(l.getBounds()));
  });

  // Routes d'accès sans code dans le KML (ex. "ROUTE ACCES CROSSES") : ne
  // figurent pas dans le PDF officiel, donc pas de statut ouvert/fermé.
  // Toujours affichées en noir, hors de la liste des itinéraires.
  state.geojson.features.filter(f => f.properties.kind === 'access_route').forEach(f => {
    const layer = L.geoJSON(f, { style: { color: '#000000', weight: 4, opacity: 0.9 } });
    layer.addTo(map);
    layer.eachLayer(l => {
      l.bindPopup(
        `<div class="popup-title">${f.properties.name}</div>` +
        `<div class="popup-code">Route d'accès — non gérée par le document officiel</div>`
      );
      bounds.push(l.getBounds());
    });
  });

  if (bounds.length) {
    let b = bounds[0];
    bounds.forEach(x => b.extend(x));
    map.fitBounds(b, { padding: [30, 30] });
  }
}

function baseRouteStyle() {
  return { color: '#8A8272', weight: 4, opacity: 0.9 };
}

function statusStyle(status) {
  if (status === 'OUVERTE') return { color: '#4B6B3A', weight: 5, opacity: 0.95, dashArray: null };
  if (status === 'FERMEE') return { color: '#A33B2E', weight: 5, opacity: 0.95, dashArray: '8 6' };
  return { color: '#8A8272', weight: 3, opacity: 0.6, dashArray: '2 4' };
}

function getStatus(routeId) {
  const day = state.status.days[state.dayIndex];
  if (!day) return null;
  return day.tranches[state.slot][routeId] || null;
}

function renderDayTabs() {
  const el = document.getElementById('day-tabs');
  el.innerHTML = '';
  state.status.days.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === state.dayIndex ? ' active' : '');
    const dt = new Date(d.date + 'T00:00:00');
    btn.innerHTML = `<strong>${DAY_FMT.format(dt)}</strong>`;
    btn.onclick = () => { state.dayIndex = i; renderDayTabs(); renderAll(); };
    el.appendChild(btn);
  });
}

function renderSlotTabs() {
  const el = document.getElementById('slot-tabs');
  el.innerHTML = '';
  const slots = state.status.time_slots;
  Object.keys(STATUS_LABELS).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (key === state.slot ? ' active' : '');
    btn.innerHTML = `<strong>${STATUS_LABELS[key]}</strong><span class="small">${slots[key]}</span>`;
    btn.onclick = () => { state.slot = key; renderSlotTabs(); renderAll(); };
    el.appendChild(btn);
  });
}

function renderAll() {
  Object.entries(routeLayers).forEach(([routeId, { layer, feature }]) => {
    const status = getStatus(routeId);
    layer.setStyle(statusStyle(status));
    const label = status === 'OUVERTE' ? 'Ouvert' : status === 'FERMEE' ? 'Fermé' : 'Statut inconnu';
    const day = state.status.days[state.dayIndex];
    const rows = Object.keys(STATUS_LABELS).map(key => {
      const s = day.tranches[key][routeId];
      const cls = s === 'OUVERTE' ? 'ouverte' : s === 'FERMEE' ? 'fermee' : 'inconnue';
      return `<div class="popup-row"><span>${STATUS_LABELS[key]}</span><span class="badge ${cls}">${s === 'OUVERTE' ? 'Ouvert' : s === 'FERMEE' ? 'Fermé' : '?'}</span></div>`;
    }).join('');
    layer.eachLayer(l => l.bindPopup(
      `<div class="popup-title">${feature.properties.name}</div>` +
      `<div class="popup-code">${feature.properties.route_id}</div>` +
      rows
    ));
  });
  renderRouteList();
  renderStatusCard();
}

function renderRouteList() {
  const el = document.getElementById('route-list');
  el.innerHTML = '';
  const items = Object.entries(routeLayers).map(([routeId, { feature }]) => ({
    routeId, feature, status: getStatus(routeId)
  }));
  items.sort((a, b) => {
    const rank = s => s === 'FERMEE' ? 0 : s === 'OUVERTE' ? 1 : 2;
    return rank(a.status) - rank(b.status);
  });
  items.forEach(({ routeId, feature, status }) => {
    const div = document.createElement('div');
    div.className = 'route-item';
    const cls = status === 'OUVERTE' ? 'ouverte' : status === 'FERMEE' ? 'fermee' : 'inconnue';
    const label = status === 'OUVERTE' ? 'Ouvert' : status === 'FERMEE' ? 'Fermé' : '?';
    div.innerHTML = `<div><div class="name">${feature.properties.name}</div><div class="code">${routeId}</div></div><span class="badge ${cls}">${label}</span>`;
    div.onclick = () => focusRoute(routeId);
    el.appendChild(div);
  });
}

function focusRoute(routeId) {
  const entry = routeLayers[routeId];
  if (!entry) return;
  const layers = [];
  entry.layer.eachLayer(l => layers.push(l));
  if (layers.length) {
    map.fitBounds(layers[0].getBounds(), { padding: [60, 60], maxZoom: 14 });
    layers[0].openPopup();
  }
  if (window.closeRouteDrawer) window.closeRouteDrawer();
}

function renderStatusCard() {
  const dt = new Date(state.status.generated_at);
  const hours = (Date.now() - dt.getTime()) / 36e5;

  const card = document.getElementById('status-card');
  const icon = document.getElementById('status-icon');
  const main = document.getElementById('status-main');
  const sub = document.getElementById('status-sub');

  const MONTHS_SHORT = ['janv', 'févr', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];
  const dateStr = `${dt.getDate()} ${MONTHS_SHORT[dt.getMonth()]}`;
  const timeStr = dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  main.textContent = `Dernière mise à jour réussie : ${dateStr} - ${timeStr}`;

  let relLabel;
  if (hours < 1) relLabel = "il y a moins d'une heure";
  else if (hours < 24) relLabel = `il y a ${Math.floor(hours)} h`;
  else relLabel = `il y a ${Math.floor(hours / 24)} j`;

  let level;
  if (hours <= 24) level = 'fresh';
  else if (hours <= 30) level = 'warn';
  else level = 'stale';

  icon.textContent = level === 'fresh' ? '✓' : '⚠';
  sub.textContent = relLabel + (level !== 'fresh'
    ? ' — vérifie le document officiel en cas de doute'
    : '');

  card.classList.remove('fresh', 'warn', 'stale');
  card.classList.add(level);
}

let pollTimer = null;
let pollAttempts = 0;
const POLL_INTERVAL_MS = 10000;
const POLL_MAX_ATTEMPTS = 30; // 30 × 10s = 5 minutes max

// Suivi réel du workflow via l'API publique de GitHub (dépôt public, sans jeton).
const GH_API = 'https://api.github.com/repos/Cx260-AEW/champ-tir-avord/actions';
const STEP_POLL_MS = 6000;
const STEP_MAX_MS = 8 * 60 * 1000;

// Étapes affichées à l'utilisateur, associées aux étapes du workflow par leur nom.
const UPDATE_STAGES = [
  { label: "Préparation", job: 'update-status', match: /^(Checkout|Set up Python|Installer|Cache du navigateur)/ },
  { label: "Lecture du PDF officiel", job: 'update-status', match: /^Récupérer et parser/,
    error: "Impossible de lire le PDF officiel (site inforoute18 inaccessible ou format modifié)." },
  { label: "Enregistrement des données", job: 'update-status', match: /^Committer/,
    error: "Les nouvelles données n'ont pas pu être enregistrées." },
  { label: "Préparation du site", job: 'deploy-pages', match: /^(Checkout|Setup Pages|Upload artifact)/,
    error: "La préparation du site a échoué." },
  { label: "Publication du site", job: 'deploy-pages', match: /^Deploy to GitHub Pages/,
    error: "GitHub Pages a refusé la publication (panne passagère possible), réessaie dans quelques minutes." },
];

let stepTimer = null;

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (stepTimer) { clearTimeout(stepTimer); stepTimer = null; }
}

function resetUpdateButton() {
  const btn = document.getElementById('force-update-btn');
  btn.disabled = false;
  btn.textContent = 'Forcer une mise à jour';
}

function showProgress(kind, text, fraction, withReload) {
  const box = document.getElementById('update-progress');
  box.hidden = false;
  box.className = 'update-progress' + (kind === 'running' ? '' : ' ' + kind);
  document.getElementById('update-progress-text').textContent = text;
  document.getElementById('update-progress-fill').style.width = Math.round(fraction * 100) + '%';
  document.getElementById('update-reload-btn').hidden = !withReload;
}

// Calcule l'état d'avancement à partir de la liste des jobs d'un run.
function analyseRun(jobs) {
  const total = UPDATE_STAGES.length;
  const jobByName = {};
  jobs.forEach(j => { jobByName[j.name] = j; });
  const isOk = st => st.status === 'completed' && (st.conclusion === 'success' || st.conclusion === 'skipped');

  let current = 0;
  for (let i = 0; i < total; i++) {
    const stg = UPDATE_STAGES[i];
    const job = jobByName[stg.job];
    const steps = job ? (job.steps || []).filter(st => stg.match.test(st.name)) : [];
    const failedStep = steps.find(st => st.conclusion === 'failure');
    // Les tentatives de déploiement sont répétées : seule l'issue du job compte.
    const jobFailed = job && job.status === 'completed' && job.conclusion === 'failure';
    if (failedStep && (stg.job === 'update-status' || jobFailed)) {
      return { state: 'error', stage: i, message: stg.error || 'Une étape a échoué.' };
    }
    if (jobFailed && !steps.length) {
      return { state: 'error', stage: i, message: stg.error || 'Une étape a échoué.' };
    }
    const done = steps.length > 0 && steps.every(isOk) &&
      (stg.job !== 'deploy-pages' || i < total - 1 || (job.status === 'completed' && job.conclusion === 'success'));
    if (done) current = i + 1; else break;
  }
  if (current >= total) return { state: 'success' };
  return { state: 'running', stage: current };
}

async function ghJson(path) {
  const resp = await fetch(GH_API + path, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if (!resp.ok) throw new Error('GitHub API ' + resp.status);
  return resp.json();
}

async function latestDispatchRunId() {
  const data = await ghJson('/workflows/update.yml/runs?event=workflow_dispatch&per_page=1');
  return data.workflow_runs && data.workflow_runs[0] ? data.workflow_runs[0].id : 0;
}

function followRun(baselineRunId, previousGeneratedAt) {
  const startedAt = Date.now();
  let runId = null;
  const total = UPDATE_STAGES.length;
  showProgress('running', 'Mise à jour en cours : démarrage…', 0.02, false);

  const tick = async () => {
    if (Date.now() - startedAt > STEP_MAX_MS) {
      showProgress('error', "Erreur : la mise à jour prend trop de temps. Réessaie dans quelques minutes.", 1, false);
      resetUpdateButton();
      return;
    }
    try {
      if (!runId) {
        const data = await ghJson('/workflows/update.yml/runs?event=workflow_dispatch&per_page=3');
        const run = (data.workflow_runs || []).find(r => r.id > baselineRunId);
        if (run) runId = run.id;
      }
      if (runId) {
        const data = await ghJson('/runs/' + runId + '/jobs?per_page=10');
        const res = analyseRun(data.jobs || []);
        if (res.state === 'error') {
          showProgress('error', 'Erreur à l’étape ' + (res.stage + 1) + ' / ' + total + ' : ' + res.message, (res.stage + 1) / total, false);
          resetUpdateButton();
          return;
        }
        if (res.state === 'success') {
          showProgress('success', 'Mise à jour réussie, réactualise le site.', 1, true);
          resetUpdateButton();
          return;
        }
        showProgress('running', 'Mise à jour en cours : étape ' + (res.stage + 1) + ' / ' + total +
          ' — ' + UPDATE_STAGES[res.stage].label, (res.stage + 0.5) / total, false);
      }
    } catch (err) {
      // API GitHub indisponible ou limite atteinte : on bascule sur la
      // vérification du fichier de données, sans étapes détaillées.
      showProgress('running', 'Mise à jour en cours…', 0.3, false);
      startPollingForFreshData(previousGeneratedAt);
      return;
    }
    stepTimer = setTimeout(tick, STEP_POLL_MS);
  };
  stepTimer = setTimeout(tick, 3000);
}

function startPollingForFreshData(previousGeneratedAt) {
  if (pollTimer) clearInterval(pollTimer);
  pollAttempts = 0;

  pollTimer = setInterval(async () => {
    pollAttempts++;

    if (pollAttempts > POLL_MAX_ATTEMPTS) {
      stopPolling();
      resetUpdateButton();
      showProgress('error', "Erreur : toujours pas de nouvelle donnée après 5 min. Réessaie plus tard.", 1, false);
      return;
    }

    try {
      const resp = await fetch('data/status.json', { cache: 'no-store' });
      const data = await resp.json();
      if (data.generated_at !== previousGeneratedAt) {
        stopPolling();
        state.status = data;
        renderAll();
        resetUpdateButton();
        showProgress('success', 'Mise à jour réussie, réactualise le site.', 1, true);
      }
    } catch (err) {
      // Erreur ponctuelle : on retente au prochain passage.
    }
  }, POLL_INTERVAL_MS);
}

async function forceUpdate() {
  if (UPDATE_WORKER_URL.includes('REMPLACE-MOI')) {
    alert("Le relais de mise à jour n'est pas encore configuré (voir worker/README.md).");
    return;
  }

  const btn = document.getElementById('force-update-btn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Déclenchement…';
  stopPolling();

  let baseline = 0;
  try { baseline = await latestDispatchRunId(); } catch (e) { baseline = -1; }

  try {
    const resp = await fetch(UPDATE_WORKER_URL, { method: 'POST' });
    const data = await resp.json().catch(() => ({}));

    if (resp.ok && data.ok) {
      btn.textContent = 'Actualisation en cours…';
      if (baseline >= 0) {
        followRun(baseline, state.status.generated_at);
      } else {
        showProgress('running', 'Mise à jour en cours…', 0.3, false);
        startPollingForFreshData(state.status.generated_at);
      }
      return;
    }

    if (resp.status === 429 && data.retry_after_seconds) {
      showProgress('error', `Erreur : une mise à jour vient d'être déclenchée par quelqu'un d'autre, réessaie dans ${data.retry_after_seconds} s.`, 1, false);
    } else {
      showProgress('error', `Erreur : la mise à jour n'a pas pu être déclenchée (${data.error || resp.status}).`, 1, false);
    }
  } catch (err) {
    showProgress('error', 'Erreur réseau : ' + err.message, 1, false);
  }
  btn.disabled = false;
  btn.textContent = originalLabel;
}

document.getElementById('update-reload-btn').addEventListener('click', () => location.reload());

init().catch(err => {
  document.getElementById('map').innerHTML =
    `<div style="padding:2rem;font-family:var(--font-mono);">Erreur de chargement des données : ${err.message}</div>`;
  console.error(err);
});
</script>

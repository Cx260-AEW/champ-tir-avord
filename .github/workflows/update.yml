name: Mise à jour quotidienne des statuts

on:
  schedule:
    # Minute non-ronde (17) plutôt que pile 3h00 : les horaires "ronds"
    # sont les plus demandés sur GitHub Actions et subissent le plus de
    # retard en cas de file d'attente. Pas de garantie totale, mais réduit
    # nettement le risque de délai important.
    - cron: '17 3 * * *'
  workflow_dispatch: {}   # bouton "Run workflow" dans l'onglet Actions : déclenchement manuel à la demande
  push:
    branches: [main]      # republie aussi à chaque modification du code

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Récupérer et parser le PDF officiel
        id: scrape
        run: python scripts/update_status.py
        continue-on-error: true

      - name: Committer les nouvelles données (si changement)
        if: steps.scrape.outcome == 'success'
        run: |
          git config user.name "champ-tir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/status.json

          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
            exit 0
          fi

          git commit -m "Mise à jour automatique des statuts $(date -u +%Y-%m-%d)"

          # En cas de push concurrent (ex. une modification manuelle poussée
          # au même moment), on rebase sur le dernier état distant et on
          # retente, plutôt que d'échouer immédiatement comme avant.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejeté (tentative $i/5) — récupération et rebase avant nouvel essai..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 5))
          done

          echo "::error::Échec du push après 5 tentatives (collisions répétées avec d'autres pushs)."
          exit 1

      - name: Avertir en cas d'échec du scraping
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::Le scraping du PDF a échoué — voir le diagnostic détaillé dans les logs de l'étape 'Récupérer et parser le PDF officiel' ci-dessus. Le site continue d'afficher la dernière donnée valide."

      - name: Publier le texte brut extrait du PDF (pour diagnostic)
        if: steps.scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: debug-pdf-text
          path: /tmp/debug_pdf_text.txt
          if-no-files-found: ignore
          retention-days: 7

# Remarque : il n'y a plus de job de déploiement ici. GitHub Pages est
# configuré en mode "Deploy from a branch" (main / docs), donc GitHub
# publie automatiquement le contenu de docs/ dès que ce job pousse un
# commit sur main — sans job Actions supplémentaire, ce qui élimine le
# délai de provisionnement d'une seconde machine (~20-30s gagnées).
# Voir README.md pour le réglage correspondant dans Settings → Pages.
